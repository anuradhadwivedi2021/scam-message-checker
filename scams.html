function add(parent, tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; e.textContent = text; parent.appendChild(e); return e; }
function render(l) {
  const u = UI[l]; document.documentElement.lang = l;
  $("back").textContent = u.back; $("title").textContent = u.title; $("sub").textContent = u.sub;

  document.querycelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", ctring(b.dataset.l === l)));
  const g = $("grid"); g.textContent = "";

}
