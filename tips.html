<head>
<meta charset="utf-8">

<title>ScamGuard AI Safety Tips Quiz</title>
<style>
:root{--ink:#0e2238;--navy:#0b2540;--navy2:#144468;--bg:#f3f6fa;--card:#fff;--line:#dde5ee;--mut:#556b82;--acc:#0d5ca8;--bad:#c42b32;--good:#157a4a;--amber:#f5a623}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);background:radial-gradient(900px 420px at 8% -8%,#d9e7f6,transparent 70%),radial-gradient(700px 400px at 100% 0,#e8f3ef,transparent 70%),var(--bg);font:17px/1.6 system-ui,"Noto Sans Devanagari","Segoe UI",Roboto,Arial,sans-serif}
main{width:100%;max-width:820px;margin:0 auto;padding:20px clamp(12px,3vw,28px) 56px}
header{margin-bottom:22px;padding:clamp(24px,4vw,40px);border-radius:26px;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy2));box-shadow:0 24px 44px -20px rgba(11,37,64,.6)}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;text-decoration:none;font-weight:700;font-size:.95rem}
.nav a:hover{background:rgba(255,255,255,.22)}
h1{font-size:clamp(1.9rem,5vw,2.6rem);line-height:1.1;margin:0 0 8px;letter-spacing:-.02em}
.sub{margin:0;max-width:56ch;color:#cfe0f1;font-size:1.05rem}
.lang{display:inline-flex;gap:2px;margin-top:20px;padding:4px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08)}
.lang button{background:transparent;color:#fff;border:0;min-height:44px;padding:0 18px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer}
.lang button[aria-pressed=true]{background:#fff;color:var(--navy)}
:focus-visible{outline:3px solid #2563eb;outline-offset:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;margin-bottom:18px;box-shadow:0 1px 2px rgba(14,34,56,.05),0 16px 34px -20px rgba(14,34,56,.25)}
.prog{color:var(--mut);font-weight:700;margin:0 0 6px}
.bar{height:10px;background:rgba(14,34,56,.09);border-radius:8px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
h2{font-size:1.25rem;margin:0 0 14px;line-height:1.4}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:left;min-height:52px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.right{border-color:var(--good);background:#eaf7f0}
.opt.wrong{border-color:var(--bad);background:#fdf3f2}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;background:#f0f5fb;border-left:5px solid var(--acc)}
.fb strong{display:block}
.btn{font:inherit;font-weight:700;min-height:52px;padding:0 26px;border-radius:14px;cursor:pointer;border:2px solid var(--ink);background:var(--ink);color:#fff;margin-top:14px}
.score{font-size:2.4rem;font-weight:800;margin:6px 0}
.habits li{margin-bottom:8px}
.help{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#fff5f5,#ffeceb);border:1.5px solid #f3c4c8;border-radius:20px;padding:18px 22px}
.help strong{color:var(--bad)}
.help a{display:inline-flex;align-items:center;min-height:52px;background:var(--bad);color:#fff;text-decoration:none;padding:0 26px;border-radius:999px;font-weight:800}
[hidden]{display:none!important}
html.hc{--ink:#000;--mut:#222;--line:#222;--bg:#fff;--card:#fff;--navy:#000;--navy2:#000;--acc:#00346b}
html.hc body{background:#fff}
html.sr body{font-size:22px}
html.sr .opt,html.sr .btn{min-height:64px}
@media (max-width:560px){body{font-size:16px}header{border-radius:20px}.lang{display:flex;width:100%}.lang button{flex:1;padding:0 8px}.nav a{flex:1 1 calc(50% - 10px);justify-content:center}.help a{width:100%;justify-content:center}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>try{var p=JSON.parse(localStorage.getItem("sg_prefs")||"{}");if(p.hc)document.documentElement.classList.add("hc");if(p.sr)document.documentElement.classList.add("sr")}catch(e){}</script>
